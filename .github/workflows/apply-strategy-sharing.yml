name: Apply strategy sharing integration

on:
  push:
    paths:
      - 'scripts/apply-strategy-sharing.mjs'
      - '.github/workflows/apply-strategy-sharing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply integration patch
        run: node scripts/apply-strategy-sharing.mjs
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          git commit -m "feat: integrate strategy sharing links"
          git push
