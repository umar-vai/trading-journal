name: Apply auth redirect fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-auth-redirect-fix.mjs'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply auth redirect patch
        run: node scripts/apply-auth-redirect-fix.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No auth redirect changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: redirect signup confirmations to GitHub Pages app"
          git push origin HEAD:main
