name: Apply glossary info tooltips

on:
  push:
    branches: [main]
    paths:
      - 'src/InfoTip.tsx'
      - 'scripts/apply-info-tooltips.py'
      - '.github/workflows/apply-info-tooltips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply tooltip patch
        run: python3 scripts/apply-info-tooltips.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/App.tsx src/AdvancedFeatures.tsx src/Phase2Workspace.tsx src/styles.css; then
            echo "No tooltip changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/AdvancedFeatures.tsx src/Phase2Workspace.tsx src/styles.css
          git commit -m "feat: add contextual info tooltips across trading journal"
          git push origin HEAD:main
