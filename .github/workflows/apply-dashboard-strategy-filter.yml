name: Apply dashboard strategy filter

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-dashboard-strategy-filter.mjs'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply dashboard strategy patch
        run: node scripts/apply-dashboard-strategy-filter.mjs

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/App.tsx src/styles.css; then
            echo "No dashboard changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "feat: scope dashboard analytics by selected strategy"
          git push origin HEAD:main
